# Ambiente de desenvolvimento local. Não expor diretamente à internet.
# O gitlink é "golang-simulador" (com o), não "golang-simulator".
# Incluir Mongo e Kafka uma única vez evita imports duplicados de subcomposes.
include:
  - ./mongodb/docker-compose.yaml
  - ./kafka/docker-compose.yaml

services:
  simulator:
    build:
      context: ./golang-simulador
      dockerfile: Dockerfile
    working_dir: /app
    command: ["sh", "-c", "go run ./cmd/simulator"]
    volumes:
      - ./golang-simulador:/app
    environment:
      MONGO_URI: mongodb://root:root@mongo:27017/routes?authSource=admin&directConnection=true
      KAFKA_BROKER: kafka:9092
      KAFKA_ROUTE_TOPIC: route
      KAFKA_FREIGHT_TOPIC: freight
      KAFKA_SIMULATION_TOPIC: simulation
      KAFKA_GROUP_ID: route-group
    depends_on:
      - mongo
      - kafka

  nest:
    build:
      context: ./nestjs-api
      dockerfile: Dockerfile
    working_dir: /home/node/app
    command: ["sh", "-c", "npm ci && npx prisma generate && npm run start:dev"]
    volumes:
      - ./nestjs-api:/home/node/app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: mongodb://root:root@mongo:27017/nest?authSource=admin&directConnection=true
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ROUTES_API_KEY: ${ROUTES_API_KEY:?Defina ROUTES_API_KEY no .env (32+ caracteres)}
    depends_on:
      - mongo
      - kafka

  next:
    build:
      context: ./next-frontend
      dockerfile: Dockerfile
    working_dir: /home/node/app
    command: ["sh", "-c", "npm ci && npm run dev -- --hostname 0.0.0.0"]
    volumes:
      - ./next-frontend:/home/node/app
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NEST_API_URL: http://nest:3000
      NEXT_PUBLIC_NEST_API_URL: http://localhost:3000
      NEXT_PUBLIC_NEXT_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - nest
